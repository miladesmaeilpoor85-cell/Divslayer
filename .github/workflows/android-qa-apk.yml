name: Android QA APK

on:
  push:
    branches:
      - "main"
      - "feature/quest-point-framework"
      - "feat/animation-pipeline-warrior-attack"
    paths:
      - ".github/workflows/android-qa-apk.yml"
      - "ci/android-qa-export-presets.cfg"
      - "project.godot"
      - "icon.png"
      - "assets/**"
      - "data/**"
      - "scenes/**"
      - "scripts/**"
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/android-qa-apk.yml"
      - "ci/android-qa-export-presets.cfg"
      - "project.godot"
      - "icon.png"
      - "assets/**"
      - "data/**"
      - "scenes/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-qa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-android-qa:
    name: Export Divslayer QA APK (Godot 4.7.2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_RELEASE: "https://github.com/godotengine/godot/releases/download/4.7.2-stable"
      ANDROID_BUILD_TOOLS: "35.0.1"
      ANDROID_PLATFORM: "35"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch pinned Mage casting atlas
        run: python3 tools/fetch_mage_cast_front_asset.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Download and verify Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error "$GODOT_RELEASE/Godot_v4.7.2-stable_linux.x86_64.zip" --output godot.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum --check -
          curl --fail --location --silent --show-error "$GODOT_RELEASE/Godot_v4.7.2-stable_export_templates.tpz" --output templates.tpz
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          sudo install -m 755 "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
          template_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir" "$RUNNER_TEMP/templates"
          unzip -q templates.tpz 'templates/*' -d "$RUNNER_TEMP/templates"
          cp "$RUNNER_TEMP/templates/templates/"* "$template_dir/"
          echo "4.7.2.stable" > "$template_dir/version.txt"
          test -s "$template_dir/android_debug.apk"
          godot --version

      - name: Create an isolated, temporary QA debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/divslayer-qa-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Divslayer QA Debug,O=QA,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/divslayer-qa-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Prepare isolated Android QA export preset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          cp ci/android-qa-export-presets.cfg export_presets.cfg
          grep -F 'package/unique_name="com.example.divslayer.qa"' export_presets.cfg
          test ! -e signing
          test -s export_presets.cfg

      - name: Select Mage runtime QA scene for this APK only
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#run/main_scene="res://scenes/main.tscn"#run/main_scene="res://scenes/dev/mage_cast_runtime_qa.tscn"#' project.godot
          grep -F 'run/main_scene="res://scenes/dev/mage_cast_runtime_qa.tscn"' project.godot
          test -s tests/mage_cast_runtime_qa.gd
          test -s scenes/dev/mage_cast_runtime_qa.tscn

      - name: Import project and export debug APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$ANDROID_HOME"
          export JAVA_HOME="$JAVA_HOME"
          run_godot_checked() {
            local label="$1"
            shift
            local logfile="$RUNNER_TEMP/${label}.log"
            set +e
            "$@" 2>&1 | tee "$logfile"
            local status=${PIPESTATUS[0]}
            set -e
            if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|ERROR: Failed to create an autoload" "$logfile"; then
              echo "::error::Godot reported a script parse/load error during ${label}."
              return 1
            fi
            return "$status"
          }
          run_godot_checked import godot --headless --editor --path . --quit
          run_godot_checked export godot --headless --path . --export-debug "Android QA" build/android/Divslayer-QA.apk
          test -s build/android/Divslayer-QA.apk

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          aapt="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt"
          "$apksigner" verify --verbose build/android/Divslayer-QA.apk
          "$aapt" dump badging build/android/Divslayer-QA.apk | tee build/android/apk-badging.txt
          "$aapt" dump xmltree build/android/Divslayer-QA.apk AndroidManifest.xml | tee build/android/manifest-xmltree.txt
          grep -F "package: name='com.example.divslayer.qa'" build/android/apk-badging.txt
          # Godot uses an exported activity-alias; validate the actual binary manifest
          # rather than relying on aapt dump badging to resolve activity aliases.
          grep -F 'com.godot.game.GodotAppLauncher' build/android/manifest-xmltree.txt
          grep -F 'android.intent.action.MAIN' build/android/manifest-xmltree.txt
          grep -F 'android.intent.category.LAUNCHER' build/android/manifest-xmltree.txt
          grep -F 'android:exported(0x01010010)=(type 0x12)0xffffffff' build/android/manifest-xmltree.txt
          grep -F "native-code: 'arm64-v8a'" build/android/apk-badging.txt
          sha256sum build/android/Divslayer-QA.apk | tee build/android/Divslayer-QA.apk.sha256

      - name: Upload APK diagnostics if validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Divslayer-Android-APK-Diagnostics
          path: |
            build/android/Divslayer-QA.apk
            build/android/apk-badging.txt
            build/android/manifest-xmltree.txt
            build/android/Divslayer-QA.apk.sha256
          if-no-files-found: warn
          retention-days: 7

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Install and launch APK in Android emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu auto -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          script: >-
            set -eu; trap 'timeout 20s adb logcat -d -v time > build/android/emulator-logcat.txt 2>&1 || true; timeout 20s adb shell dumpsys activity activities > build/android/emulator-activity.txt 2>&1 || true' EXIT; echo "Locking emulator to landscape before app launch"; adb shell settings put system accelerometer_rotation 0; adb shell settings put system user_rotation 1; sleep 3; adb shell settings get system user_rotation; echo "Installing Divslayer QA APK"; adb shell settings put secure immersive_mode_confirmations confirmed || true; adb logcat -c; timeout 240s adb install -r build/android/Divslayer-QA.apk; adb shell pm path com.example.divslayer.qa | grep -F 'package:'; launcher="$(timeout 30s adb shell cmd package resolve-activity --brief --user 0 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.example.divslayer.qa | tr -d '\r')"; printf '%s\n' "$launcher"; printf '%s\n' "$launcher" | grep -F 'com.example.divslayer.qa/'; timeout 60s adb shell monkey -p com.example.divslayer.qa 1; sleep 20; timeout 30s adb logcat -d -v time > build/android/emulator-logcat.txt; if grep -E 'FATAL EXCEPTION|Fatal signal|SIGSEGV|SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' build/android/emulator-logcat.txt; then echo "::error::Android runtime reported a fatal or Godot script error."; exit 1; fi; grep -F 'OnGodotSetupCompleted' build/android/emulator-logcat.txt; grep -F 'MAGE_CAST_FRONT_RUNTIME_PASS' build/android/emulator-logcat.txt; grep -F 'MAGE_CAST_FRONT_CANCEL_PASS' build/android/emulator-logcat.txt; timeout 30s adb shell run-as com.example.divslayer.qa ls -l files/mage-cast-front-active.png; timeout 30s adb exec-out run-as com.example.divslayer.qa cat files/mage-cast-front-active.png > build/android/mage-cast-front-active.png; test -s build/android/mage-cast-front-active.png; timeout 30s adb shell dumpsys activity activities > build/android/emulator-activity.txt; foreground="$(grep -E 'topResumedActivity|ResumedActivity' build/android/emulator-activity.txt | grep -F 'com.example.divslayer.qa/' )"; test -n "$foreground"; printf '%s\n' "$foreground"; if timeout 30s adb shell screencap -p /sdcard/divslayer-qa-launch.png && timeout 30s adb pull /sdcard/divslayer-qa-launch.png build/android/emulator-launch.png && test -s build/android/emulator-launch.png; then echo "Captured Android QA launch screenshot."; else echo "::warning::Screenshot capture unavailable; app launch and foreground checks passed."; fi; echo 'Divslayer Godot setup completed and the QA app remained in the foreground.'

      - name: Upload emulator diagnostics if launch validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Divslayer-Android-Emulator-Diagnostics
          path: |
            build/android/Divslayer-QA.apk
            build/android/emulator-logcat.txt
            build/android/emulator-activity.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload installable QA APK
        uses: actions/upload-artifact@v4
        with:
          name: Divslayer-Android-QA-APK
          path: |
            build/android/Divslayer-QA.apk
            build/android/Divslayer-QA.apk.sha256
            build/android/apk-badging.txt
            build/android/emulator-logcat.txt
            build/android/emulator-launch.png
            build/android/mage-cast-front-active.png
          if-no-files-found: warn
          retention-days: 14
