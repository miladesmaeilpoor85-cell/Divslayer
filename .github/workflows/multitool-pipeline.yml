name: Multi-tool production pipeline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/multitool-pipeline.yml"
      - "scripts/**"
      - "tests/**"
      - "tools/**"
      - "assets/**"
      - "data/**"
      - "scenes/**"
      - "project.godot"
      - "gdlintrc"
      - "creative/animation/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multitool-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gdscript-static-analysis:
    name: GDScript lint — gdtoolkit 4.5.0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned GDScript Toolkit
        run: python -m pip install --disable-pip-version-check "gdtoolkit==4.5.0"
      - name: Lint all GDScript source and tests
        run: gdlint scripts tests

  python-static-analysis:
    name: Python lint — Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.16.8"
      - name: Compile all project Python tools
        run: python -m py_compile tools/*.py tools/creative/*.py
      - name: Lint the maintained pipeline tools
        run: ruff check tools/asset_audit.py tools/test_asset_audit.py tools/audio_audit.py tools/test_audio_audit.py tools/test_sprite_sheet.py tools/artwork_review.py tools/ci_map_previews.py tools/animation_review.py tools/test_animation_review.py tools/image_assets.py tools/test_image_assets.py tools/animation_quality_audit.py tools/test_animation_quality_audit.py tools/import_animation_atlas.py tools/test_import_animation_atlas.py tools/map_preview.py tools/test_map_preview.py tools/map_depth_audit.py tools/test_map_depth_audit.py tools/creative/*.py

  audio-quality:
    name: Audio decode and metadata — FFmpeg
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PyAV with bundled FFmpeg libraries
        run: python -m pip install --disable-pip-version-check "av==19.0.2"
      - name: Unit-test and decode every game audio file
        run: |
          python -m unittest discover -s tools -p "test_audio_audit.py" -v
          python tools/audio_audit.py --report artifacts/audio-report.json
      - name: Upload audio analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Divslayer-Audio-Analysis
          path: artifacts/audio-report.json
          if-no-files-found: ignore
          retention-days: 14

  artwork-and-level-design:
    name: Artwork decode and map previews — Pillow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Pillow, NumPy, and SVG renderer
        run: python -m pip install --disable-pip-version-check "Pillow==13.0.0" "numpy==2.3.4" "CairoSVG==2.9.1"
      - name: Test raster and SVG image loading
        run: python -m unittest discover -s tools -p "test_image_assets.py" -v
      - name: Test sprite-sheet transparency handling
        run: python -m unittest discover -s tools -p "test_sprite_sheet.py" -v
      - name: Test map preview ground-file resolution
        run: python -m unittest discover -s tools -p "test_map_preview.py" -v
      - name: Test map depth and playtime evidence audit
        run: python -m unittest discover -s tools -p "test_map_depth_audit.py" -v
      - name: Generate map depth report
        run: python tools/map_depth_audit.py --report artifacts/map-depth-report.json
      - name: Test sprite animation review
        run: python -m unittest discover -s tools -p "test_animation_review.py" -v
      - name: Render sprite animation review previews
        run: python tools/animation_review.py --output artifacts/animation-review
      - name: Test frame-level animation quality audit
        run: python -m unittest discover -s tools -p "test_animation_quality_audit.py" -v
      - name: Test generated attack atlas importer
        run: python -m unittest discover -s tools -p "test_import_animation_atlas.py" -v
      - name: Audit registered hero and enemy animation clips
        run: python tools/animation_quality_audit.py --report artifacts/animation-review/animation-quality-report.json
      - name: Fully decode the game's images and create contact sheets
        run: python tools/artwork_review.py --output artifacts/artwork-review
      - name: Render every map from map data and object sprites
        run: python tools/ci_map_previews.py --output artifacts/map-previews --scale 0.25
      - name: Upload art, animation, and map-layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Divslayer-Artwork-Animation-and-Map-Review
          path: |
            artifacts/artwork-review/
            artifacts/animation-review/
            artifacts/map-previews/
            artifacts/map-depth-report.json
          if-no-files-found: ignore
          retention-days: 14
