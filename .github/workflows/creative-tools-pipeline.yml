name: Creative tools pipeline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/creative-tools-pipeline.yml"
      - "tools/creative/**"
      - "tools/animation_pipeline.py"
      - "tools/test_animation_pipeline.py"
      - "creative/**"
      - "assets/art/**"
      - "assets/audio/**"
      - "docs/CREATIVE_TOOLS.md"
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creative-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  creative-application-smoke-tests:
    name: Krita / Audacity / LMMS / Blender
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install creative applications
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Bound network stalls and retry transient package mirror failures.
          # Refresh indexes, but don't let a slow mirror block the creative smoke tests.
          if ! timeout 120s sudo apt-get --quiet \
            -o Acquire::ForceIPv4=true \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Acquire::Languages=none \
            update; then
            echo "::warning::apt index refresh did not finish; continuing with runner-cached indexes"
          fi
          timeout 1800s sudo apt-get --quiet install --yes --no-install-recommends \
            -o Dpkg::Use-Pty=0 \
            -o Acquire::ForceIPv4=true \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            audacity blender krita lmms xvfb xauth
          sudo apt-get check
          command -v audacity
          command -v blender
          command -v krita
          command -v lmms
          # GitHub's Ubuntu runner images commonly include FFmpeg already. Only
          # install it separately when that preinstalled binary is unavailable.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            timeout 180s sudo apt-get --quiet install --yes --no-install-recommends \
              -o Dpkg::Use-Pty=0 \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              ffmpeg
          fi
          command -v ffmpeg


      - name: Install and smoke-test Pixelorama 1.2.4
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/Orama-Interactive/Pixelorama/releases/download/v1.2.4/Pixelorama-Linux-64bit.tar.gz"
          expected="692473e44fe90ea02de49048343d6b3cb86749b7beb166286dbc3a308c568e0b"
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/pixelorama.tar.gz"
          echo "$expected  $RUNNER_TEMP/pixelorama.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/pixelorama"
          tar -xzf "$RUNNER_TEMP/pixelorama.tar.gz" -C "$RUNNER_TEMP/pixelorama"
          binary="$(find "$RUNNER_TEMP/pixelorama" -type f -name 'Pixelorama.x86_64' -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          timeout 25s "$binary" --headless --quit-after 3

      - name: Install image inspection dependency
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Pillow
        run: python -m pip install --disable-pip-version-check "Pillow==13.0.0"

      - name: Exercise creative applications without changing game assets
        run: |
          python tools/creative/creative_toolchain_smoke.py \
            --output artifacts/creative-tools

      - name: Upload creative tool smoke-test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Divslayer-Creative-Tools-Review
          path: artifacts/creative-tools/
          if-no-files-found: ignore
          retention-days: 14
