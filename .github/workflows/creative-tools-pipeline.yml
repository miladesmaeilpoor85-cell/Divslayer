name: Creative tools pipeline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/creative-tools-pipeline.yml"
      - "tools/creative/**"
      - "creative/**"
      - "assets/art/**"
      - "assets/audio/**"
      - "docs/CREATIVE_TOOLS.md"
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creative-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  creative-application-smoke-tests:
    name: Krita / Audacity / LMMS / Blender
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh Ubuntu package indexes
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "Runner disk space before installing creative tools:"
          df -h
          # Bound network stalls and retry transient package mirror failures.
          if ! timeout 300s sudo apt-get \
            -o Acquire::ForceIPv4=true \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Acquire::Languages=none \
            update; then
            echo "::warning::apt index refresh did not finish; continuing with runner-cached indexes"
          fi

      - name: Install Blender
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "Installing Blender."
          timeout 600s sudo apt-get install --yes --no-install-recommends \
            -o Dpkg::Use-Pty=0 -o Acquire::ForceIPv4=true -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 blender
          blender --version | head -n 2

      - name: Install Krita
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "Installing Krita."
          timeout 600s sudo apt-get install --yes --no-install-recommends \
            -o Dpkg::Use-Pty=0 -o Acquire::ForceIPv4=true -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 krita
          command -v krita

      - name: Install Audacity
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "Installing Audacity."
          timeout 600s sudo apt-get install --yes --no-install-recommends \
            -o Dpkg::Use-Pty=0 -o Acquire::ForceIPv4=true -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 audacity
          command -v audacity

      - name: Install LMMS and virtual-display dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "Installing LMMS, Xvfb, and X authentication support."
          timeout 600s sudo apt-get install --yes --no-install-recommends \
            -o Dpkg::Use-Pty=0 -o Acquire::ForceIPv4=true -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 lmms xvfb xauth
          command -v lmms
          command -v xvfb-run
          sudo apt-get check
          # GitHub's Ubuntu runner images commonly include FFmpeg already. Only
          # install it separately when that preinstalled binary is unavailable.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            timeout 300s sudo apt-get install --yes --no-install-recommends \
              -o Dpkg::Use-Pty=0 -o Acquire::ForceIPv4=true -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 ffmpeg
          fi
          command -v ffmpeg

      - name: Install image inspection dependency
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Pillow
        run: python -m pip install --disable-pip-version-check "Pillow==13.0.0"

      - name: Exercise creative applications without changing game assets
        run: |
          python tools/creative/creative_toolchain_smoke.py \
            --output artifacts/creative-tools

      - name: Upload creative tool smoke-test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Divslayer-Creative-Tools-Review
          path: artifacts/creative-tools/
          if-no-files-found: ignore
          retention-days: 14
